max_width = 100
hard_tabs = false
tab_spaces = 2
newline_style = "Auto"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
edition = "2024"
merge_derives = true
use_try_shorthand = false
use_field_init_shorthand = false
force_explicit_abi = true
# `imports_granularity` is nightly-only: on stable rustfmt it is ignored and
# only prints a warning on every run, so it is disabled until the project moves
# to a nightly formatter.
# imports_granularity = "Crate"
