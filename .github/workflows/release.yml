name: "release"
on:
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_ENV

      - name: create release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `app-v${process.env.PACKAGE_VERSION}`,
              name: `Konachan v${process.env.PACKAGE_VERSION}`,
              body: 'See the assets to download this version and install.',
              draft: true,
              prerelease: false
            })
            return data.id

  frontend-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src -> target"

      # The frontend is a separate crate in the submodule, so `cargo clippy` on
      # the backend above never sees it. Both transports are linted because
      # either can be the one that ships: `web` for the browser build, `tauri`
      # for the desktop bundle. The lint runs on the host target, which is
      # enough for type and lint errors; `trunk` does the real wasm build.
      - name: format check
        run: cargo fmt --manifest-path src/Cargo.toml --check

      - name: clippy (web transport)
        run: cargo clippy --manifest-path src/Cargo.toml --features web -- -D warnings

      - name: clippy (tauri transport)
        run: cargo clippy --manifest-path src/Cargo.toml --features tauri -- -D warnings

  build-tauri:
    needs: [create-release, frontend-check]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned to the same channel as `src/rust-toolchain.toml`, so CI cannot
      # drift onto a newer compiler than the one the project claims to support.
      - name: install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy check
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
